name: Build and Push Docker Image

# 构建 iptv-spider Docker 镜像并推送到 GitHub Container Registry (GHCR) 及 Docker Hub。
# 触发方式：
#   1) 推送 main 或 master 分支自动构建 latest
#   2) 推送版本 tag（如 1.0 或 v1.0.0）自动构建版本 tag + latest
#   3) 在 Actions 页面手动运行 (workflow_dispatch)，支持输入自定义 tag
#
# 依赖 Secrets (非必填，填入即推送 Docker Hub):
#   - DOCKERHUB_USERNAME: Docker Hub 用户名
#   - DOCKERHUB_TOKEN 或 DOCKERHUB_PASSWORD: Docker Hub 访问令牌或密码

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag（如 1.0 或 latest）'
        required: true
        default: 'latest'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 计算镜像 tags
        id: tags
        env:
          INPUT_TAG: ${{ inputs.tag }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASS: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
          GHCR_REPO: ghcr.io/${{ github.repository_owner }}/iptv-spider
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="$INPUT_TAG"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="latest"
          fi

          TAGS="${GHCR_REPO}:${V}"
          if [ "$V" != "latest" ]; then
            TAGS="${TAGS},${GHCR_REPO}:latest"
          fi

          if [ -n "$DOCKERHUB_USER" ] && [ -n "$DOCKERHUB_PASS" ]; then
            TAGS="${TAGS},${DOCKERHUB_USER}/iptv-spider:${V}"
            if [ "$V" != "latest" ]; then
              TAGS="${TAGS},${DOCKERHUB_USER}/iptv-spider:latest"
            fi
            echo "has_dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dockerhub=false" >> "$GITHUB_OUTPUT"
          fi

          echo "list=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "tag=${V}" >> "$GITHUB_OUTPUT"
          echo "将构建并推送 tags: ${TAGS}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.tags.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
